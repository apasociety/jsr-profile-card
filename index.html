<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>অপেক্ষার নাম — শেখ হাসিনা | প্রোফাইল ফটোকার্ড</title><style>@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#250000,#9f0808 65%,#310300);font-family:'Hind Siliguri',sans-serif;color:#fff}.wrap{max-width:740px;margin:auto;padding:22px 14px 40px}h1{text-align:center;font-size:clamp(22px,4vw,32px);margin:0 0 4px}.sub{text-align:center;opacity:.8;margin:0 0 18px}.preview{background:#fff;padding:8px;border-radius:18px;box-shadow:0 12px 36px #0008}canvas{display:block;width:100%;height:auto;border-radius:10px;touch-action:none;cursor:grab}.controls{margin-top:18px;background:#ffffff12;border:1px solid #ffffff30;border-radius:16px;padding:16px}.buttons{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 18px;background:#fff;color:#920000;font:700 16px 'Hind Siliguri',sans-serif;cursor:pointer;flex:1}.btn.primary{background:#ffcf40;color:#510000}.btn:disabled{opacity:.5;cursor:not-allowed}.field{margin:14px 0}.field label{display:flex;justify-content:space-between;margin-bottom:6px}input[type=range]{width:100%;accent-color:#ffd34d}.hint{font-size:14px;opacity:.82;line-height:1.6}.footer{text-align:center;opacity:.7;font-size:13px;margin-top:20px}</style></head><body><main class="wrap"><h1>প্রোফাইল ফটোকার্ড তৈরি করুন</h1><p class="sub">জয় বাংলা • জয় বঙ্গবন্ধু</p><section class="preview"><canvas id="card" width="1278" height="1230" aria-label="ফটোকার্ড প্রিভিউ"></canvas></section><section class="controls"><div class="buttons"><button class="btn primary" id="upload">📷 ছবি আপলোড করুন</button><button class="btn" id="change">🔄 ছবি পরিবর্তন</button><input id="file" type="file" accept="image/*" hidden></div><div class="field"><label for="zoom">ছবি জুম <span id="zoomVal">100%</span></label><input type="range" id="zoom" min="100" max="300" value="100"></div><div class="field"><label for="brightness">উজ্জ্বলতা <span id="brightVal">100%</span></label><input type="range" id="brightness" min="50" max="160" value="100"></div><div class="field"><label for="contrast">কনট্রাস্ট <span id="contrastVal">100%</span></label><input type="range" id="contrast" min="50" max="160" value="100"></div><div class="buttons"><button class="btn" id="reset">↺ রিসেট / ক্রপ ঠিক করুন</button><button class="btn primary" id="download">⬇ PNG ডাউনলোড</button></div><p class="hint">ছবি আপলোড করে গোলাকার ফ্রেমের মধ্যে আঙুল বা মাউস দিয়ে টেনে জায়গা ঠিক করুন। জুম দিয়ে ক্রপ করুন। ছবিটি আপনার ডিভাইসেই থাকে; কোথাও আপলোড হয় না।</p></section><p class="footer">যশোর জেলা আওয়ামী লীগ।</p></main><script>
const canvas=document.getElementById('card'),ctx=canvas.getContext('2d'),poster=new Image(),photo=new Image();let ready=false,hasPhoto=false,scale=1,dx=0,dy=0,drag=false,last=null;const CX=638,CY=641,R=273;poster.src='assets/banner.png';poster.onload=()=>{ready=true;draw()};poster.onerror=()=>alert('assets/banner.png পাওয়া যায়নি। ফাইলের অবস্থান দেখুন।');const zoom=document.getElementById('zoom'),bright=document.getElementById('brightness'),contrast=document.getElementById('contrast'),file=document.getElementById('file');function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);if(ready)ctx.drawImage(poster,0,0,canvas.width,canvas.height);ctx.save();ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.clip();ctx.fillStyle='#fff4ed';ctx.fillRect(CX-R,CY-R,R*2,R*2);if(hasPhoto){let base=Math.max(R*2/photo.naturalWidth,R*2/photo.naturalHeight),w=photo.naturalWidth*base*scale,h=photo.naturalHeight*base*scale;ctx.filter=`brightness(${bright.value}%) contrast(${contrast.value}%)`;ctx.drawImage(photo,CX-w/2+dx,CY-h/2+dy,w,h);ctx.filter='none'}else{ctx.fillStyle='#a51313';ctx.fillRect(CX-R,CY-R,R*2,R*2);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 42px Hind Siliguri, sans-serif';ctx.fillText('এখানে আপনার ছবি',CX,CY-8);ctx.font='29px Hind Siliguri, sans-serif';ctx.fillText('আপলোড করুন',CX,CY+43)}ctx.restore();ctx.beginPath();ctx.arc(CX,CY,R+3,0,Math.PI*2);ctx.lineWidth=8;ctx.strokeStyle='#fff8d1';ctx.stroke()}
function openFile(){file.click()}document.getElementById('upload').onclick=openFile;document.getElementById('change').onclick=openFile;file.onchange=()=>{let f=file.files?.[0];if(!f)return;if(!f.type.startsWith('image/'))return alert('ছবি নির্বাচন করুন');let url=URL.createObjectURL(f);photo.onload=()=>{hasPhoto=true;scale=1;dx=dy=0;zoom.value=100;document.getElementById('zoomVal').textContent='100%';draw();URL.revokeObjectURL(url)};photo.onerror=()=>{URL.revokeObjectURL(url);alert('ছবিটি খোলা যাচ্ছে না')};photo.src=url};zoom.oninput=()=>{scale=+zoom.value/100;document.getElementById('zoomVal').textContent=zoom.value+'%';draw()};for(let [el,out] of [[bright,'brightVal'],[contrast,'contrastVal']])el.oninput=()=>{document.getElementById(out).textContent=el.value+'%';draw()};document.getElementById('reset').onclick=()=>{dx=dy=0;scale=1;zoom.value=bright.value=contrast.value=100;for(let id of ['zoomVal','brightVal','contrastVal'])document.getElementById(id).textContent='100%';draw()};function pos(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}canvas.addEventListener('pointerdown',e=>{if(!hasPhoto)return;let p=pos(e);if(Math.hypot(p.x-CX,p.y-CY)>R)return;drag=true;last=p;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;let p=pos(e);dx+=p.x-last.x;dy+=p.y-last.y;last=p;draw()});for(let evt of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(evt,()=>drag=false);document.getElementById('download').onclick=()=>{if(!hasPhoto)return alert('প্রথমে নিজের ছবি আপলোড করুন।');draw();canvas.toBlob(blob=>{if(!blob)return alert('ডাউনলোড করা যাচ্ছে না');let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='opekkhar-naam-sheikh-hasina.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)},'image/png')};
</script></body></html>
