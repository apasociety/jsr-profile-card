<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>অপেক্ষার নাম — শেখ হাসিনা | প্রোফাইল ফটোকার্ড</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(145deg, #250000, #9f0808 65%, #310300);
      font-family: 'Hind Siliguri', sans-serif;
      color: #fff;
    }
    .wrap { max-width: 740px; margin: auto; padding: 22px 14px 40px; }
    h1 { text-align: center; font-size: clamp(22px, 4vw, 32px); margin: 0 0 4px; }
    .sub { text-align: center; opacity: .85; margin: 0 0 18px; }
    .preview {
      background: #fff;
      padding: 8px;
      border-radius: 18px;
      box-shadow: 0 12px 36px #0008;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 10px;
      touch-action: none;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }
    .controls {
      margin-top: 18px;
      background: #ffffff12;
      border: 1px solid #ffffff30;
      border-radius: 16px;
      padding: 16px;
    }
    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn {
      border: 0;
      border-radius: 10px;
      padding: 12px 10px;
      background: #fff;
      color: #920000;
      font: 700 16px 'Hind Siliguri', sans-serif;
      cursor: pointer;
      width: 100%;
    }
    .btn.primary { background: #ffcf40; color: #510000; }
    .reset-row { margin-top: 10px; }
    .field { margin: 16px 0; }
    .field label { display: flex; justify-content: space-between; margin-bottom: 6px; }
    input[type="range"] { width: 100%; accent-color: #ffd34d; }
    .hint { font-size: 14px; opacity: .82; line-height: 1.6; margin: 10px 0 0; }
    .footer { text-align: center; opacity: .7; font-size: 13px; margin-top: 20px; }
    @media (max-width: 420px) { .btn { font-size: 14px; padding: 12px 5px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>প্রোফাইল ফটোকার্ড তৈরি করুন</h1>
    <p class="sub">জয় বাংলা • জয় বঙ্গবন্ধু</p>

    <section class="preview">
      <canvas id="card" width="1278" height="1230" aria-label="ফটোকার্ড প্রিভিউ"></canvas>
    </section>

    <section class="controls">
      <!-- ফ্রেমের ঠিক নিচে দুটি বাটন পাশাপাশি -->
      <div class="buttons">
        <button type="button" class="btn primary" id="upload">📷 ছবি আপলোড / পরিবর্তন</button>
        <button type="button" class="btn primary" id="download">⬇ photo ডাউনলোড</button>
      </div>
      <input id="file" type="file" accept="image/*" hidden>

      <!-- দুটি বাটনের ঠিক নিচে একটি পূর্ণ-প্রস্থ রিসেট বাটন -->
      <div class="reset-row">
        <button type="button" class="btn" id="reset">↺ রিসেট / ক্রপ ঠিক করুন</button>
      </div>

      <div class="field">
        <label for="zoom">ছবি জুম <span id="zoomVal">100%</span></label>
        <input type="range" id="zoom" min="100" max="300" value="100">
      </div>
      <div class="field">
        <label for="brightness">উজ্জ্বলতা <span id="brightVal">100%</span></label>
        <input type="range" id="brightness" min="50" max="160" value="100">
      </div>

      <p class="hint">ছবি আপলোড করে গোলাকার ফ্রেমের মধ্যে মাউস বা আঙুল দিয়ে টেনে অবস্থান ঠিক করুন। জুম ও উজ্জ্বলতা পরিবর্তন করতে পারবেন। তারপর PNG ডাউনলোড করুন এবং ফেসবুকে আপলোড করুন।</p>
    </section>
    <p class="footer">যশোর জেলা আওয়ামী লীগ।</p>
  </main>

  <script>
    const canvas = document.getElementById('card');
    const ctx = canvas.getContext('2d');
    const poster = new Image();
    const photo = new Image();
    const zoom = document.getElementById('zoom');
    const brightness = document.getElementById('brightness');
    const file = document.getElementById('file');

    const CX = 638, CY = 641, R = 273;
    let posterReady = false;
    let hasPhoto = false;
    let scale = 1, dx = 0, dy = 0;
    let dragging = false, last = null;

    // আপনার আগের ডিজাইনের ব্যানারটি একই পাথে রাখুন।
    poster.onload = () => { posterReady = true; draw(); };
    poster.onerror = () => {
      console.warn('assets/banner.png পাওয়া যায়নি। ব্যানারের ফাইলের পাথ দেখুন।');
      draw();
    };
    poster.src = 'assets/banner.png';

    function photoSize() {
      const base = Math.max((R * 2) / photo.naturalWidth, (R * 2) / photo.naturalHeight);
      return { w: photo.naturalWidth * base * scale, h: photo.naturalHeight * base * scale };
    }

    function keepPhotoInsideCircle() {
      if (!hasPhoto) return;
      const { w, h } = photoSize();
      dx = Math.max(-((w - R * 2) / 2), Math.min((w - R * 2) / 2, dx));
      dy = Math.max(-((h - R * 2) / 2), Math.min((h - R * 2) / 2, dy));
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (posterReady) {
        ctx.drawImage(poster, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#9f0808';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      ctx.save();
      ctx.beginPath();
      ctx.arc(CX, CY, R, 0, Math.PI * 2);
      ctx.clip();
      ctx.fillStyle = '#fff4ed';
      ctx.fillRect(CX - R, CY - R, R * 2, R * 2);

      if (hasPhoto) {
        keepPhotoInsideCircle();
        const { w, h } = photoSize();
        ctx.filter = `brightness(${brightness.value}%)`;
        ctx.drawImage(photo, CX - w / 2 + dx, CY - h / 2 + dy, w, h);
        ctx.filter = 'none';
      } else {
        ctx.fillStyle = '#a51313';
        ctx.fillRect(CX - R, CY - R, R * 2, R * 2);
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = 'bold 42px "Hind Siliguri", sans-serif';
        ctx.fillText('এখানে আপনার ছবি', CX, CY - 8);
        ctx.font = '29px "Hind Siliguri", sans-serif';
        ctx.fillText('আপলোড করুন', CX, CY + 43);
      }
      ctx.restore();

      ctx.beginPath();
      ctx.arc(CX, CY, R + 3, 0, Math.PI * 2);
      ctx.lineWidth = 8;
      ctx.strokeStyle = '#fff8d1';
      ctx.stroke();
    }

    document.getElementById('upload').addEventListener('click', () => {
      file.value = '';
      file.click();
    });

    file.addEventListener('change', () => {
      const f = file.files && file.files[0];
      if (!f) return;
      if (!f.type.startsWith('image/')) {
        alert('একটি ছবি নির্বাচন করুন।');
        return;
      }
      const url = URL.createObjectURL(f);
      photo.onload = () => {
        hasPhoto = true;
        scale = 1; dx = 0; dy = 0;
        zoom.value = 100;
        document.getElementById('zoomVal').textContent = '100%';
        draw();
        URL.revokeObjectURL(url);
      };
      photo.onerror = () => {
        URL.revokeObjectURL(url);
        alert('ছবিটি খোলা যাচ্ছে না।');
      };
      photo.src = url;
    });

    zoom.addEventListener('input', () => {
      scale = Number(zoom.value) / 100;
      document.getElementById('zoomVal').textContent = `${zoom.value}%`;
      draw();
    });

    brightness.addEventListener('input', () => {
      document.getElementById('brightVal').textContent = `${brightness.value}%`;
      draw();
    });

    document.getElementById('reset').addEventListener('click', () => {
      dx = 0; dy = 0; scale = 1;
      zoom.value = 100;
      brightness.value = 100;
      document.getElementById('zoomVal').textContent = '100%';
      document.getElementById('brightVal').textContent = '100%';
      draw();
    });

    function position(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * canvas.width / rect.width,
        y: (e.clientY - rect.top) * canvas.height / rect.height
      };
    }

    canvas.addEventListener('pointerdown', e => {
      if (!hasPhoto) return;
      const p = position(e);
      if (Math.hypot(p.x - CX, p.y - CY) > R) return;
      dragging = true;
      last = p;
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove', e => {
      if (!dragging) return;
      const p = position(e);
      dx += p.x - last.x;
      dy += p.y - last.y;
      last = p;
      draw();
    });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(evt => {
      canvas.addEventListener(evt, () => { dragging = false; last = null; });
    });

    document.getElementById('download').addEventListener('click', () => {
      if (!hasPhoto) {
        alert('প্রথমে নিজের ছবি আপলোড করুন।');
        return;
      }
      draw();
      canvas.toBlob(blob => {
        if (!blob) {
          alert('ডাউনলোড করা যাচ্ছে না।');
          return;
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'opekkhar-naam-sheikh-hasina.png';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 3000);
      }, 'image/png');
    });

    if (document.fonts) document.fonts.ready.then(draw);
    draw();
  </script>
</body>
</html>
